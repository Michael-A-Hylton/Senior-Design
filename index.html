<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WealthWise: Tax Optimization</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    nav {
      background-color: #34495e;
      padding: 1rem;
      display: flex;
      justify-content: center;
    }
    nav a {
      color: white;
      margin: 0 1rem;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
    .container {
      padding: 2rem;
    }
    .question-section {
      display: block;
    }
    .question {
      margin-bottom: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      background-color: #2ecc71;
      border: none;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    .disclaimer {
      font-size: 0.9rem;
      color: #555;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>WealthWise: Tax Optimization</h1>
  </header>

  <nav>
    <a href="/">Home</a>
  </nav>

  <div class="container">
    <form action="/calculate" method="POST">
      <div class="income-input">
        <label for="filing-status">Select your filing status:</label>
        <select id="filing-status" name="filing-status">
          <option value="single">Single</option>
          <option value="head">Head of Household</option>
          <option value="joint">Married Filing Jointly or Surviving Spouse</option>
        </select>
      </div>
      <div class="income-input">
        <label for="income">Enter your income: $</label>
        <input type="number" id="income" name="income" placeholder="e.g. 75000" required />
      </div>

      <h2>Claim Credits</h2>
      <div class="question">
        <label><input type="checkbox" name="childcare-credit-toggle" /> Employer-provided childcare credit</label>
        <div id="childcare-expenditures">
          <label>Childcare facility expenditures: $<input type="number" name="facility-exp" /></label><br />
          <label>Resource and referral expenditures: $<input type="number" name="referral-exp" /></label>
        </div>
      </div>
       <!-- Energy Efficient Home Credit -->
      <div class="question">
        <label><input type="checkbox" name="energy-eff-home-toggle" /> Energy Efficient Home Credit (up to $5,000)</label>
        <div id="energy-eff-home-exp">
          <label>Energy efficient home expenditures: $<input type="number" name="energy-eff-home-exp" /></label>
        </div>
      </div>

      <div class="question">
        <label><input type="checkbox" name="opp-zone-toggle" /> Opportunity Zones</label>
        <div id="opp-zone-section">
          <label>Deferred Gain: $<input type="number" name="deferred-gain" /></label><br />
          <label>Fair Market Value of Fund Investment: $<input type="number" name="fair-market-value" /></label><br />
          <label>Basis in Fund Investment: $<input type="number" name="basis-value" /></label>
        </div>
      </div>
      <div class="question">
        <label><input type="checkbox" name="fuel-tax-toggle" /> Fuel Tax Credit (farm/off-road use)</label>
        <div id="fuel-expenses">
          <label>Fuel Expenses (nontaxable use): $<input type="number" name="fuel-exp" /></label>
        </div>
      </div>
      <div class="question">
        <label><input type="checkbox" name="clean-vehicle-credit" /> Clean vehicle credits (up to $7,500)</label>
      </div>

      <!-- Advanced Energy Project Credit -->
      <div class="question">
        <label><input type="checkbox" name="advanced-energy-project-toggle" /> Advanced Energy Project Credit</label>
        <div id="advanced-energy-project-exp">
          <label>Advanced energy project expenditures: $<input type="number" name="advanced-energy-project-exp" /></label>
        </div>
      </div>

      <!-- Work Opportunity Tax Credit -->
      <div class="question">
        <label><input type="checkbox" name="wotc-toggle" /> Work Opportunity Tax Credit (up to $2,400)</label>
      </div>

      <!-- Research Credit -->
      <div class="question">
        <label><input type="checkbox" name="research-credit-toggle" /> Research Credit</label>
        <div id="research-expenses">
          <label>Research and development expenses: $<input type="number" name="research-expenses" /></label>
        </div>
      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>

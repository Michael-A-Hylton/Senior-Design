<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WealthWise: Tax Optimization</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    nav {
      background-color: #34495e;
      padding: 1rem;
      display: flex;
      justify-content: center;
    }
    nav a {
      color: white;
      margin: 0 1rem;
      text-decoration: none;
      font-weight: bold;
    }
    .container {
      padding: 2rem;
    }
    .section {
      margin-bottom: 2rem;
      padding: 1rem;
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
    }
    .section h2 {
      color: #2c3e50;
      margin-bottom: 1rem;
    }
    .question {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
    }
    input[type="number"], select {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
    }
    button {
      padding: 0.75rem 1.5rem;
      background-color: #2ecc71;
      border: none;
      color: white;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>WealthWise: Tax Optimization</h1>
  </header>
  <nav>
    <a href="/">Home</a>
  </nav>
  <div class="container">
    <form action="/calculate" method="POST">

      <!-- Business Profile -->
      <div class="section">
        <h2>Business Profile</h2>
        <label for="filing-status">Filing Status:</label>
        <select id="filing-status" name="filing-status">
          <option value="single">Single</option>
          <option value="head">Head of Household</option>
          <option value="joint">Married Filing Jointly or Surviving Spouse</option>
        </select>
        <label for="income">Annual Income ($):</label>
        <input type="number" id="income" name="income" placeholder="e.g. 75000" required />
        <label for="num-employees">Number of Employees:</label>
        <input type="number" id="num-employees" name="num-employees" />
      </div>

      <!-- Tax Credits -->
      <div class="section">
        <h2>Eligible Credits</h2>
        <div class="question">
          <label><input type="checkbox" name="childcare-credit-toggle" /> Employer-Provided Childcare Credit</label>
          <label>Facility Expenses ($): <input type="number" name="facility-exp" /></label>
          <label>Referral Expenses ($): <input type="number" name="referral-exp" /></label>
        </div>

        <div class="question">
          <label><input type="checkbox" name="fuel-tax-toggle" /> Fuel Tax Credit (Farm/Off-road Use)</label>
          <label>Fuel Expenses ($): <input type="number" name="fuel-exp" /></label>
        </div>

        <div class="question">
          <label><input type="checkbox" name="clean-vehicle-credit" /> Clean Vehicle Credit (up to $7,500)</label>
        </div>

        <div class="question">
          <label><input type="checkbox" name="research-credit-toggle" /> Research Credit</label>
          <label>Research Expenses ($): <input type="number" name="research-expenses" /></label>
        </div>

        <div class="question">
          <label><input type="checkbox" name="opp-zone-toggle" /> Opportunity Zones</label>
          <label>Deferred Gain ($): <input type="number" name="deferred-gain" /></label>
          <label>Fair Market Value ($): <input type="number" name="fair-market-value" /></label>
          <label>Basis Value ($): <input type="number" name="basis-value" /></label>
        </div>

        <div class="question">
          <label><input type="checkbox" name="fica-tip-toggle" /> FICA Tip Credit</label>
          <label>Total Tips ($): <input type="number" name="total-tips" /></label>
          <label>Hours Worked: <input type="number" name="hours-worked" /></label>
          <label>Wages Paid ($): <input type="number" name="direct-wages" /></label>
        </div>

        <div class="question">
          <label><input type="checkbox" name="retirement-startup-toggle" /> Retirement Plans Startup Credit</label>
          <label>Number of NHCEs: <input type="number" name="num-nhces" /></label>
          <label>Startup Costs ($): <input type="number" name="startup-costs" /></label>
        </div>

        <div class="question">
          <label><input type="checkbox" name="advanced-energy-project-toggle" /> Advanced Energy Project Credit</label>
          <label>Project Expenditures ($): <input type="number" name="advanced-energy-project-exp" /></label>
        </div>

        <div class="question">
          <label><input type="checkbox" name="energy-eff-home-toggle" /> Energy Efficient Home Credit</label>
          <label>Energy Home Expenses ($): <input type="number" name="energy-eff-home-exp" /></label>
        </div>

        <div class="question">
          <label><input type="checkbox" name="wotc-toggle" /> Work Opportunity Tax Credit (WOTC)</label>
        </div>
      </div>

      <!-- Deductions -->
      <div class="section">
        <h2>Eligible Deductions</h2>
        <div class="question">
          <label><input type="checkbox" name="energy-efficient-building-toggle" /> Energy Efficient Commercial Building Deduction</label>
          <label>Square Footage: <input type="number" name="building-sqft" /></label>
          <label>Energy Savings (%): <input type="number" name="energy-savings-percent" /></label>
        </div>

        <div class="question">
          <label><input type="checkbox" name="business-interest-toggle" /> Business Interest Deduction</label>
          <label>Interest Income ($): <input type="number" name="business-interest-income" /></label>
          <label>Adjusted Taxable Income ($): <input type="number" name="adjusted-taxable-income" /></label>
          <label>Floor Plan Interest ($): <input type="number" name="floor-plan-interest" /></label>
        </div>

        <div class="question">
          <label><input type="checkbox" name="mileage-deduction-toggle" /> Mileage Deduction</label>
          <label>Miles Driven: <input type="number" name="business-miles" /></label>
        </div>

        <div class="question">
          <label><input type="checkbox" name="home-office-toggle" /> Home Office Deduction</label>
          <label>Square Feet Used: <input type="number" name="home-office-sqft" /></label>
        </div>
      </div>

      <div class="section" style="text-align: center;">
        <button type="submit">Calculate Savings</button>
      </div>
    </form>
  </div>
</body>
</html>
